name: Release

on:
  release:
    types: [published]
  # Re-publish an existing release, e.g. after one platform failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag"
        required: true
      target:
        description: "Where to publish"
        type: choice
        options: [all, github, curseforge, modrinth]
        default: all

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ inputs.target || 'all' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches mod_version
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$TAG" != "$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match mod_version '$MOD_VERSION' in gradle.properties"
            exit 1
          fi

      - name: Mark alpha/beta as pre-release
        run: |
          case "${TAG,,}" in
            *alpha*|*beta*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease ;;
          esac

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Attach jars to GitHub release
        if: env.TARGET == 'all' || env.TARGET == 'github'
        run: gh release upload "$TAG" "build/libs/*-$TAG.jar" --repo "$GITHUB_REPOSITORY" --clobber

      # Inert until curseforge_project / modrinth_project are set in gradle.properties and the
      # CURSEFORGE_API_KEY / MODRINTH_API_KEY secrets exist.
      - name: Publish to CurseForge and Modrinth
        if: env.TARGET != 'github'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
        run: |
          case "$TARGET" in
            curseforge) TASK=publishCurseforge; NEED=curseforge_project ;;
            modrinth)   TASK=publishModrinth;   NEED=modrinth_project ;;
            *)          TASK=publishMods;       NEED='(curseforge|modrinth)_project' ;;
          esac

          if ! grep -qE "^$NEED=.+" gradle.properties; then
            echo "::notice::No $NEED in gradle.properties yet, skipping $TASK"
            exit 0
          fi

          CHANGELOG=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          export CHANGELOG
          ./gradlew "$TASK"
