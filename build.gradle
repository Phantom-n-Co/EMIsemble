plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Which recipe viewer is in the dev runtime: emi (default), jei, both or none. Parity checks need one at a time.
def viewerCompat = providers.gradleProperty('viewerCompat').getOrElse('emi')

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content {
            includeGroup 'dev.emi'
        }
    }

    // JEI, Immersive Engineering, Ars Nouveau, Malum/Lodestone, Titanium, Patchouli.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = 'IllusiveC4'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
            includeGroup 'com.illusivesoulworks.caelus'
        }
    }

    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }

    maven {
        name = 'KliKli'
        url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'
        content {
            includeGroup 'com.klikli_dev'
        }
    }

    maven {
        name = 'Shadows of Fire'
        url = 'https://maven.shadowsoffire.dev/releases'
        content {
            includeGroup 'dev.shadowsoffire'
        }
    }

    maven {
        name = 'Twelve Iterations'
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
        content {
            includeGroup 'net.blay09.mods'
        }
    }

    maven {
        name = 'Team Resourceful'
        url = 'https://maven.teamresourceful.com/repository/maven-public/'
        content {
            includeGroupByRegex 'com\\.teamresourceful.*'
            includeGroupByRegex 'earth\\.terrarium.*'
        }
    }

    maven {
        name = 'Favouriteless'
        url = 'https://maven.favouriteless.dev/releases'
        content {
            includeGroupByRegex 'net\\.favouriteless.*'
        }
    }

    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }

    maven {
        name = 'BreakInBlocks'
        url = 'https://maven.breakinblocks.com/releases'
        content {
            includeGroupByRegex 'com\\.breakinblocks.*'
        }
    }

    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
        content {
            includeGroup 'com.github.glitchfiend'
        }
    }

    // Thaumaturge, but doesn't have 1.21.1 version >:(
//    maven {
//        name = "Leclown"
//        url = "https://maven.leclowndu93150.dev/releases"
//    }

    // Hosts without an author maven: these two are the only sources for their mods.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseForge'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        clientQuick {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'emi-test'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments.addAll '-Xmx6G'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "dev.emi:emi-neoforge:${emi_version}"

    // One viewer per run: with both installed, JEMI hides the other mod's JEI categories and a parity probe
    // reads zero. -PviewerCompat=jei / emi.
    if (viewerCompat == 'emi' || viewerCompat == 'both') {
        localRuntime "dev.emi:emi-neoforge:${emi_version}"
    }
    if (viewerCompat == 'jei' || viewerCompat == 'both') {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.9.3") { transitive = false }
    localRuntime("com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-4.1.0.8") { transitive = false }
    compileOnly("com.hrznstudio:titanium:1.21-4.0.56") { transitive = false }
    localRuntime("com.hrznstudio:titanium:1.21-4.0.56") { transitive = false }
    compileOnly("net.blay09.mods:balm-neoforge:21.0.67+${minecraft_version}") { transitive = false }
    localRuntime("net.blay09.mods:balm-neoforge:21.0.67+${minecraft_version}") { transitive = false }
    implementation("dev.shadowsoffire:HostileNeuralNetworks:${minecraft_version}-6.5.1") { transitive = false }
    compileOnly("dev.architectury:architectury-neoforge:13.0.12") { transitive = false }
    localRuntime("dev.architectury:architectury-neoforge:13.0.12") { transitive = false }
    implementation("com.breakinblocks.animusnv:AnimusNV:${minecraft_version}-5.2.26") { transitive = false }
    implementation("dev.shadowsoffire:GatewaysToEternity:${minecraft_version}-5.1.0") { transitive = false }
    compileOnly("com.breakinblocks.neovitae:neovitae:${minecraft_version}-1.1.53") { transitive = false }
    localRuntime("com.breakinblocks.neovitae:neovitae:${minecraft_version}-1.1.53") { transitive = false }
    compileOnly("com.klikli_dev:modonomicon-${minecraft_version}-neoforge:1.123.0") { transitive = false }
    localRuntime("com.klikli_dev:modonomicon-${minecraft_version}-neoforge:1.123.0") { transitive = false }
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:5.13.5.1445") { transitive = false }
    localRuntime("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:5.13.5.1445") { transitive = false }
    compileOnly("com.teamresourceful.resourcefullib:resourcefullib-neoforge-1.21:3.0.12") { transitive = false }
    localRuntime("com.teamresourceful.resourcefullib:resourcefullib-neoforge-1.21:3.0.12") { transitive = false }
    compileOnly("com.teamresourceful.resourcefulconfig:resourcefulconfig-neoforge-1.21:3.0.11") { transitive = false }
    localRuntime("com.teamresourceful.resourcefulconfig:resourcefulconfig-neoforge-1.21:3.0.11") { transitive = false }
    implementation("com.alexthw.starbunclemania:starbunclemania-${minecraft_version}:1.5.9.50") { transitive = false }
    implementation("com.alexthw.ars_elemental:ars_elemental-${minecraft_version}:0.7.10.4.191") { transitive = false }
    compileOnly("org.appliedenergistics:appliedenergistics2:19.2.19") { transitive = false }
    localRuntime("org.appliedenergistics:appliedenergistics2:19.2.19") { transitive = false }
    localRuntime("org.appliedenergistics:guideme:21.1.22") { transitive = false }
    implementation("com.sammy.malum:malum:${minecraft_version}-1.8.2.150") { transitive = false }
    compileOnly("team.lodestar.lodestone:lodestone:${minecraft_version}-1.8.2.523") { transitive = false }
    localRuntime("team.lodestar.lodestone:lodestone:${minecraft_version}-1.8.2.523") { transitive = false }

    implementation("net.favouriteless.enchanted:enchanted-neoforge-${minecraft_version}:4.2.7") { transitive = false }
    compileOnly("net.favouriteless.stateobserver:stateobserver-neoforge-${minecraft_version}:1.6.4") { transitive = false }
    localRuntime("net.favouriteless.stateobserver:stateobserver-neoforge-${minecraft_version}:1.6.4") { transitive = false }
    compileOnly("net.favouriteless.modopedia:modopedia-neoforge-${minecraft_version}:1.1.11") { transitive = false }
    localRuntime("net.favouriteless.modopedia:modopedia-neoforge-${minecraft_version}:1.1.11") { transitive = false }

    implementation("earth.terrarium.chipped:chipped-neoforge-${minecraft_version}:4.0.2") { transitive = false }
    compileOnly("earth.terrarium.athena:athena-neoforge-${minecraft_version}:4.0.6") { transitive = false }
    localRuntime("earth.terrarium.athena:athena-neoforge-${minecraft_version}:4.0.6") { transitive = false }

    implementation "maven.modrinth:functional-storage:1.21-1.5.7"
    implementation "maven.modrinth:cooking-for-blockheads:21.1.25+neoforge-${minecraft_version}"
    implementation "maven.modrinth:animalpens:2.5.2-1.21+NeoForge"
    implementation "maven.modrinth:super-factory-manager:HWz24fIm"
    implementation "maven.modrinth:ars-additions:21.3.0"
    implementation "maven.modrinth:rechiseled-chipped:2.0"
    implementation "maven.modrinth:rechiseled:1.2.6-neoforge-mc1.21"
    implementation "maven.modrinth:golem-overhaul:V1OtffxB"
    implementation "maven.modrinth:risus:0.8.600"
    implementation "maven.modrinth:horseman:1.5.13"
    implementation "maven.modrinth:vanillabackport:mGS7BxD4"
    implementation "maven.modrinth:construction-wand-kots:2.16.13"
    compileOnly "maven.modrinth:farmers-delight:${minecraft_version}-1.3.4"
    localRuntime "maven.modrinth:farmers-delight:${minecraft_version}-1.3.4"
    compileOnly "maven.modrinth:runiclib:tk5EQpUG"
    localRuntime "maven.modrinth:runiclib:tk5EQpUG"
    compileOnly "maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc${minecraft_version}"
    localRuntime "maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc${minecraft_version}"
    compileOnly "maven.modrinth:platform:rh4p4ixM"
    localRuntime "maven.modrinth:platform:rh4p4ixM"
    implementation "maven.modrinth:dungeons_delight:1.5.3"
    compileOnly "maven.modrinth:supermartijn642s-core-lib:1.1.26a-neoforge-mc1.21"
    localRuntime "maven.modrinth:supermartijn642s-core-lib:1.1.26a-neoforge-mc1.21"
    compileOnly "maven.modrinth:supermartijn642s-config-lib:1.1.8-neoforge-mc1.21"
    localRuntime "maven.modrinth:supermartijn642s-config-lib:1.1.8-neoforge-mc1.21"
    localRuntime "maven.modrinth:lionfish-api:3.1"
    compileOnly "maven.modrinth:l_enders-cataclysm:3.33"
    localRuntime "maven.modrinth:l_enders-cataclysm:3.33"
    implementation "maven.modrinth:embers-re-ignited:${minecraft_version}-1.5.9"
    implementation "maven.modrinth:toxony:pDu34HNo"
    implementation "maven.modrinth:cognition:2.4.13"
    implementation "maven.modrinth:myths-and-legends:1.1.0"
    implementation "maven.modrinth:immersivepetroleum:4.5.0-39"
    implementation "maven.modrinth:enigmaticlegacy-plus:${minecraft_version}-1.1.2"
    implementation "maven.modrinth:hexerei:0.5.0.3"
    implementation "blusunrize.immersiveengineering:ImmersiveEngineering:${minecraft_version}-12.4.2-194"

    implementation "curse.maven:thaumaturge-1628024:9452543"
    implementation "curse.maven:applied-thaumaturge-1718689:9498175"
    implementation "curse.maven:apothic-cataclysm-1214893:6320972"
    implementation "curse.maven:pagans-blessing-952071:5889348"
    implementation "curse.maven:nutritional-1579319:9456986"

    implementation("dev.shadowsoffire:Apotheosis:${minecraft_version}-8.9.0") { transitive = false }
    implementation("dev.shadowsoffire:ApothicEnchanting:${minecraft_version}-1.6.4") { transitive = false }
    implementation("dev.shadowsoffire:ApothicSpawners:${minecraft_version}-1.4.0") { transitive = false }
    compileOnly("dev.shadowsoffire:Placebo:${minecraft_version}-9.9.4") { transitive = false }
    localRuntime("dev.shadowsoffire:Placebo:${minecraft_version}-9.9.4") { transitive = false }
    localRuntime("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-2.11.0") { transitive = false }

    localRuntime "maven.modrinth:lithostitched:1.8.1-neoforge-21.1"
    localRuntime "top.theillusivec4.curios:curios-neoforge:9.5.1+${minecraft_version}"

    localRuntime("vazkii.patchouli:Patchouli:${minecraft_version}-93-NEOFORGE") { transitive = false }
    localRuntime "com.illusivesoulworks.caelus:caelus-neoforge:7.0.1+${minecraft_version}"

    implementation ("com.alexthw.eidolon_repraised:eidolon_repraised-${minecraft_version}:0.5.0.9.83") {transitive=false}

    // Dev only: thaumaturge (+ some other mods?) cause experimental settings screen to show up, don't want that
    localRuntime "maven.modrinth:yeetus-experimentus:87.0.0"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            emi_version_range      : emi_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from("src/main/templates") {
        include "META-INF/**"
    }
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Each platform stays unconfigured until its listing exists, so publishMods cannot upload to an empty id.
def curseforgeProject = findProperty('curseforge_project')
def modrinthProject = findProperty('modrinth_project')

// Slugs that are the same on both platforms.
def commonSlugs = [
        'animus', 'apotheosis', 'apothic-enchanting', 'apothic-spawners',
        'ars-additions', 'chipped', 'construction-wand-kots', 'cooking-for-blockheads',
        'embers-re-ignited', 'enchanted-witchcraft', 'functional-storage', 'golem-overhaul',
        'hexerei', 'horseman', 'hostile-neural-networks', 'malum',
        'nutritional', 'pagans-blessing', 'rechiseled', 'risus',
        'super-factory-manager', 'toxony', 'vanillabackport',
        'gateways-to-eternity',
]

// CurseForge-only: the project is named differently there, or is not on Modrinth at all.
def cfSlugs = [
        'animal-pens', 'applied-thaumaturge', 'ars-elemental', 'cognition-mod',
        'dungeons-delight', 'enigmatic-legacy-plus', 'immersive-engineering',
        'immersive-petroleum', 'lendercataclysm', 'myths-n-legends', 'starbunclemania',
        'thaumaturge',
]

// Modrinth-only, same reason in reverse.
def mrSlugs = [
        'animalpens', 'cognition', 'dungeons_delight', 'enigmaticlegacy-plus',
        'immersiveengineering', 'immersivepetroleum', 'l_enders-cataclysm', 'myths-and-legends',
]

if (curseforgeProject || modrinthProject) {
    publishMods {
        file = tasks.named('jar').flatMap { it.archiveFile }
        version = project.version
        changelog = providers.environmentVariable('CHANGELOG').orElse('See the GitHub release notes')
        displayName = "${mod_name} ${project.version}"
        type = me.modmuss50.mpp.ReleaseType.of(mod_version.contains('alpha') ? 'alpha' : mod_version.contains('beta') ? 'beta' : 'stable')
        modLoaders.add('neoforge')
        dryRun = providers.gradleProperty('publishDryRun').isPresent()

        if (curseforgeProject) {
            curseforge {
                projectId = curseforgeProject
                accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
                javaVersions.add(JavaVersion.VERSION_21)
                minecraftVersions.add(minecraft_version)
                client = true
                server = false
                requires('emi')
                optional((commonSlugs + cfSlugs) as String[])
            }
        }

        if (modrinthProject) {
            modrinth {
                projectId = modrinthProject
                accessToken = providers.environmentVariable('MODRINTH_API_KEY')
                minecraftVersions.add(minecraft_version)
                requires('emi')
                optional((commonSlugs + mrSlugs) as String[])
            }
        }
    }
}
