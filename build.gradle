    implementation "maven.modrinth:myths-and-legends:1.1.0"
    implementation "maven.modrinth:immersivepetroleum:4.5.0-39"
    implementation "blusunrize.immersiveengineering:ImmersiveEngineering:1.21.1-12.4.2-194"
    implementation "curse.maven:enigmatic-legacy-plus-1391021:9141458"

    implementation "curse.maven:hexerei-548599:6376510"

    // Apotheosis and its addons.
    implementation "curse.maven:apotheosis-313970:8993983"
    implementation "curse.maven:apothic-enchanting-1063926:9095862"
    implementation "curse.maven:apothic-spawners-986583:8469405"
    compileOnly "curse.maven:placebo-283644:9153039"
    localRuntime "curse.maven:placebo-283644:9153039"
    localRuntime "curse.maven:apothic-attributes-898963:9006294"

    implementation "curse.maven:malum-484064:7307339"
    compileOnly "curse.maven:lodestone-616457:7264731"
    localRuntime "curse.maven:lodestone-616457:7264731"

    // Thaumaturge's own required deps, needed only to boot the dev client.
    localRuntime "maven.modrinth:lithostitched:1.8.1-neoforge-21.1"
    localRuntime "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    // Enigmatic Legacy Plus' required deps.
    localRuntime "maven.modrinth:patchouli:1.21.1-93-neoforge"
    localRuntime "com.illusivesoulworks.caelus:caelus-neoforge:7.0.1+1.21.1"

    // Dev only: thaumaturge (+ some other mods?) cause experimental settings screen to show up, don't want that
    localRuntime "curse.maven:yeetusexperimentus-635427:5444189"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            emi_version_range      : emi_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from("src/main/templates") {
        include "META-INF/**"
    }
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Each platform stays unconfigured until its listing exists, so publishMods cannot upload to an empty id.
def curseforgeProject = findProperty('curseforge_project')
def modrinthProject = findProperty('modrinth_project')

if (curseforgeProject || modrinthProject) {
    publishMods {
        file = tasks.named('jar').flatMap { it.archiveFile }
        version = project.version
        changelog = providers.environmentVariable('CHANGELOG').orElse('See the GitHub release notes')
        displayName = "${mod_name} ${project.version}"
        type = me.modmuss50.mpp.ReleaseType.of(mod_version.contains('alpha') ? 'alpha' : mod_version.contains('beta') ? 'beta' : 'stable')
        modLoaders.add('neoforge')
        dryRun = providers.gradleProperty('publishDryRun').isPresent()

        if (curseforgeProject) {
            curseforge {
                projectId = curseforgeProject
                accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
                javaVersions.add(JavaVersion.VERSION_21)
                minecraftVersions.add(minecraft_version)
                client = true
                server = false
                requires('emi')
            }
        }

        if (modrinthProject) {
            modrinth {
                projectId = modrinthProject
                accessToken = providers.environmentVariable('MODRINTH_API_KEY')
                minecraftVersions.add(minecraft_version)
                requires('emi')
            }
        }
    }
}
