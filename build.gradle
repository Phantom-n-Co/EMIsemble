plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Which recipe viewer is in the dev runtime: emi (default), jei, both or none. Parity checks need one at a time.
def viewerCompat = providers.gradleProperty('viewerCompat').getOrElse('emi')

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = 'IllusiveC4'
        url = 'https://maven.theillusivec4.top/'
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseForge'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        clientQuick {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'emi-test'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments.addAll '-Xmx6G'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "dev.emi:emi-neoforge:${emi_version}"

    // One viewer per run: with both installed, JEMI hides the other mod's JEI categories and a parity probe
    // reads zero. -PviewerCompat=jei / emi.
    if (viewerCompat == 'emi' || viewerCompat == 'both') {
        localRuntime "dev.emi:emi-neoforge:${emi_version}"
    }
    if (viewerCompat == 'jei' || viewerCompat == 'both') {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }

    implementation "curse.maven:thaumaturge-1628024:9452543"

    implementation "maven.modrinth:geckolib:Grwn5rUB"
    localRuntime "maven.modrinth:terrablender:6e8GCrLb"
    compileOnly "maven.modrinth:titanium:ipoFMkfv"
    localRuntime "maven.modrinth:titanium:ipoFMkfv"
